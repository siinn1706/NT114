# Non-LLM baselines on rcaeval (CPU, V3): B0, B1 per block, B1m, B3 majority (train prior when the split has one).
# Reuses the visibility audit's evidence (same fingerprints; nothing is rebuilt):
#   PYTHONPATH=src python -m rca.baselines configs/exp/baselines-rcaeval.yaml --baro
source: canonical
data_home: null
canonical_datasets: [rcaeval]
split: within-rcaeval-grouped-0-e9b2c81c
split_roles: [val, test]
limit_per_system: null
conditions: [full, no_trace, no_log, no_metric, metrics_only, blind_root, blind_nonroot, blind_nonroot_ev]
retrieval: [none]
store_modes: [precedent]
embedder: tfidf
evidence_dir: results_visibility/rcaeval/evidence
out: results_baselines_rcaeval/grid.jsonl
models: []
