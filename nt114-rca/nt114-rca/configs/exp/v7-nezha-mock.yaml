# V7 plumbing check on a real slice: Nezha (97 incidents), mock LLM, evidence reused from the
# visibility audit (same fingerprints). Mock rows are never a result.
#   PYTHONPATH=src python -m rca.run_grid run    configs/exp/v7-nezha-mock.yaml
#   PYTHONPATH=src python -m rca.analyze         configs/analysis/v7-nezha-mock.yaml
#   PYTHONPATH=src python -m rca.reproduce       results_v7/nezha/analysis
source: canonical
data_home: null
canonical_datasets: [nezha]
split: eval-only-nezha-0-38cde4e0
split_roles: [test]
limit_per_system: null
conditions: [full, no_trace, no_log, no_metric, metrics_only, blind_root, blind_nonroot, blind_nonroot_ev]
retrieval: [none]
store_modes: [precedent]
top_k: 3
n_samples: 5
temperature: 0.7
seed: 0
embedder: tfidf
evidence_dir: results_visibility/nezha/evidence
cache: results_v7/nezha/llm_cache.sqlite
out: results_v7/nezha/grid.jsonl
models:
  - {name: mock-primary, backend: mock, role: primary, revision: mock-r1}
