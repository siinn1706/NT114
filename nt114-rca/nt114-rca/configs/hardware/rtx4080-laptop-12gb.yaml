# Planned training / serving GPU: NVIDIA RTX 4080 Laptop, 12 GB (owner-reported, not yet probed).
# Replace the hardware block with `scripts/gpu_probe.py` output on the machine, then rerun:
#   PYTHONPATH=src python -m rca.capacity configs/hardware/rtx4080-laptop-12gb.yaml --evidence-dir <evidence dir>
# Architecture numbers are copied from each repo's config.json at the pinned revision (2026-10-15).
hardware:
  name: rtx4080-laptop-12gb
  vram_gb: 12.0
  reserved_gb: 0.6              # display + driver on a laptop; measure with nvidia-smi before serving
  gpu_memory_utilization: 0.90
  runtime_overhead_gb: 1.0
  train_overhead_gb: 1.0

serve:
  n_samples: 10
  max_tokens: 400
  prompt_tokens: 2048           # used when no --evidence-dir is given
  precisions:
    qwen3.5-4b: [bf16, fp8]
    qwen3-4b-instruct-2507: [bf16, fp8]
    phi-4-mini-instruct: [bf16, fp8]
    gemma-4-e4b-it: [bf16, fp8]
    qwen3.5-9b: [fp8, nf4]
    qwen3-8b: [fp8, awq4]

train:
  seq_lens: [2048, 4096, 8192]
  lora_rank: 16
  label_tokens: 256

models:
  - name: qwen3.5-4b
    repo: Qwen/Qwen3.5-4B
    revision: 851bf6e806efd8d0a36b00ddf55e13ccb7b8cd0a
    licence: apache-2.0
    params_b: 4.66              # includes the vision encoder
    layers: 32
    hidden: 2560
    vocab: 248320
    attn_heads: 16
    kv_layers: 8                # 8 full-attention layers; 24 Gated DeltaNet layers hold a fixed state
    kv_heads: 4
    head_dim: 256
    intermediate: 9216
    state_mb_per_seq: 52        # 24 layers x 32 heads x 128 x 128 fp32, plus conv state
    notes: hybrid attention; no official quantised checkpoint (FP8 is on-the-fly)
  - name: qwen3-4b-instruct-2507
    repo: Qwen/Qwen3-4B-Instruct-2507
    revision: cdbee75f17c01a7cc42f958dc650907174af0554
    licence: apache-2.0
    params_b: 4.02
    layers: 36
    hidden: 2560
    vocab: 151936
    attn_heads: 32
    kv_layers: 36
    kv_heads: 8
    head_dim: 128
    intermediate: 9728
    notes: text-only, non-thinking only
  - name: phi-4-mini-instruct
    repo: microsoft/Phi-4-mini-instruct
    revision: cfbefacb99257ffa30c83adab238a50856ac3083
    licence: mit
    params_b: 3.84
    layers: 32
    hidden: 3072
    vocab: 200064
    attn_heads: 24
    kv_layers: 32
    kv_heads: 8
    head_dim: 128
    intermediate: 8192
  - name: gemma-4-e4b-it
    repo: google/gemma-4-E4B-it
    revision: ee0ef6023621cff504d758262d4e04895a5af4a2
    licence: apache-2.0
    params_b: 8.0               # ~4B effective; the rest are per-layer embeddings
    layers: 42
    hidden: 2560
    vocab: 262144
    attn_heads: 8
    kv_layers: 7
    kv_heads: 2
    head_dim: 512
    intermediate: 10240
    extra_embed_params_b: 2.82  # per-layer embeddings 262144 x 42 x 256, kept 16 bit
    state_mb_per_seq: 37        # 35 sliding-window layers x 512 tokens (upper bound: 18 layers share KV)
    notes: sliding-window + shared-KV architecture; KV figures are upper bounds, measure
  - name: qwen3.5-9b
    repo: Qwen/Qwen3.5-9B
    revision: c202236235762e1c871ad0ccb60c8ee5ba337b9a
    licence: apache-2.0
    params_b: 9.65
    layers: 32
    hidden: 4096
    vocab: 248320
    attn_heads: 16
    kv_layers: 8
    kv_heads: 4
    head_dim: 256
    intermediate: 12288
    tied_embeddings: false
    state_mb_per_seq: 52
    notes: no official 4-bit checkpoint; 4-bit means bitsandbytes NF4 in vLLM or a community quant (to verify)
  - name: qwen3-8b
    repo: Qwen/Qwen3-8B
    revision: b968826d9c46dd6066d109eabc6255188de91218
    licence: apache-2.0
    params_b: 8.19
    layers: 36
    hidden: 4096
    vocab: 151936
    attn_heads: 32
    kv_layers: 36
    kv_heads: 8
    head_dim: 128
    intermediate: 12288
    tied_embeddings: false
    notes: official AWQ checkpoint Qwen/Qwen3-8B-AWQ at 4da05a8edb55c6046cce958586c33b61da07bb79

# Serving profiles for the GPU feasibility test (python -m rca.feasibility). Each profile fixes the
# checkpoint revision, the vLLM quantisation, the context length and the fallback; the estimated
# VRAM is computed from the model spec above, the measured one comes from the feasibility run.
# Selection is final only after the feasibility test and the DEV pilot.
profiles:
  - name: qwen35-4b-fp8
    role: primary
    model: qwen3.5-4b
    precision: fp8                # capacity precision
    quantization: fp8             # vLLM --quantization (on-the-fly; no official FP8 checkpoint)
    max_model_len: 8192
    extra_args: [--language-model-only]
    chat_template_kwargs: {enable_thinking: false}
    fallback: qwen3-4b-2507-fp8
  - name: qwen3-4b-2507-fp8
    role: primary
    model: qwen3-4b-instruct-2507
    precision: fp8
    quantization: fp8
    max_model_len: 8192
    chat_template_kwargs: null    # non-thinking only model
    fallback: null
  - name: phi4-mini-fp8
    role: replication
    model: phi-4-mini-instruct
    precision: fp8
    quantization: fp8
    max_model_len: 8192
    chat_template_kwargs: null
    fallback: null
  - name: qwen35-9b-nf4
    role: replication
    model: qwen3.5-9b
    precision: nf4
    quantization: bitsandbytes    # in-flight NF4; hybrid-layer support in vLLM to be confirmed by the run
    max_model_len: 8192
    extra_args: [--language-model-only]
    chat_template_kwargs: {enable_thinking: false}
    fallback: qwen3-8b-awq
  - name: qwen3-8b-awq
    role: replication
    model: qwen3-8b
    repo: Qwen/Qwen3-8B-AWQ       # official 4-bit checkpoint, replaces the base repo
    revision: 4da05a8edb55c6046cce958586c33b61da07bb79
    precision: awq4
    quantization: awq_marlin
    max_model_len: 8192
    chat_template_kwargs: {enable_thinking: false}
    fallback: null                # next step is external inference, which needs owner approval
