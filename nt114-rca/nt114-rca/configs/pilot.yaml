# Chạy thử thật đầu tuần 4: 10 ca mỗi hệ thống, 1 mô hình 8B qua vLLM trên laptop 4080 12 GB.
# Trước khi chạy, mở vLLM ở terminal khác (đổi tên mô hình theo bản AWQ bạn tải):
#   vllm serve Qwen/Qwen2.5-7B-Instruct-AWQ --quantization awq --max-model-len 16384 \
#        --gpu-memory-utilization 0.85 --port 8000
data_root: data            # thư mục chứa RE2/ và RE3/ (tải bằng RCAEval)
datasets: [re2, re3]
systems: [online-boutique, sock-shop, train-ticket]
limit_per_system: 10
conditions: [full, no_trace, no_log, no_metric, blind_root]
retrieval: [none, bm25, dense, hybrid]
store_modes: [precedent, no_precedent]
top_k: 3
n_samples: 5
temperature: 0.7
seed: 0
embedder: BAAI/bge-small-en-v1.5
evidence_dir: results/evidence
cache: results/llm_cache.sqlite
out: results/pilot.jsonl
models:
  - {name: Qwen/Qwen2.5-7B-Instruct-AWQ, base_url: "http://localhost:8000/v1", backend: vllm}
