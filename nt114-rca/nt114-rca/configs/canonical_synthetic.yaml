# Canonical data path on SYNTHETIC data with the mock LLM (no GPU). Run from the repo root:
#   python scripts/make_synthetic.py data_synth_home/raw/synthetic --anchor-gap 12000
#   PYTHONPATH=src python -m rca.prep --config configs/prep_synthetic.yaml --data-home data_synth_home normalize --dataset rcaeval
#   PYTHONPATH=src python -m rca.prep --config configs/prep_synthetic.yaml --data-home data_synth_home conditions --dataset rcaeval
#   PYTHONPATH=src python -m rca.prep --config configs/prep_synthetic.yaml --data-home data_synth_home split --protocol within-rcaeval-retrieval --seed 0
#   PYTHONPATH=src python -m rca.run_grid prepare configs/canonical_synthetic.yaml
#   PYTHONPATH=src python -m rca.run_grid run     configs/canonical_synthetic.yaml
#   PYTHONPATH=src python -m rca.analyze results_canon_synth/grid.jsonl --gate mock-small mock-big
source: canonical
data_home: data_synth_home
canonical_datasets: [rcaeval]
split: within-rcaeval-retrieval-0       # prefix of data_synth_home/splits/<protocol>-<seed>-<hash8>
split_role: test
systems: [online-boutique, sock-shop, train-ticket]
limit_per_system: null
conditions: [full, no_trace, no_log, no_metric, metrics_only, blind_root, blind_nonroot]
retrieval: [none, bm25, dense, hybrid]
store_modes: [precedent, no_precedent]
top_k: 3
n_samples: 5
temperature: 0.7
seed: 0
embedder: BAAI/bge-small-en-v1.5
evidence_dir: results_canon_synth/evidence
cache: results_canon_synth/llm_cache.sqlite
out: results_canon_synth/grid.jsonl
models:
  - {name: mock-small, backend: mock}
  - {name: mock-big, backend: mock}
