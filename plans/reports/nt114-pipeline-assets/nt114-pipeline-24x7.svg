<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1440" viewBox="0 0 1920 1440" role="img" aria-labelledby="title desc">
<title id="title">NT114 — Pipeline vận hành liên tục 24/24</title>
<desc id="desc">Kiến trúc vận hành mục tiêu: giám sát 24/24, phát hiện sự cố, tóm tắt bằng chứng, LLM chẩn đoán, Jev định tuyến, team dev xử lý và tiếp tục giám sát. Phần mở rộng vận hành được vẽ bằng nét đứt.</desc>
